services:
  - type: web
    name: sistema-crediticio-frontend
    runtime: static
    buildCommand: cd app && npm install && npm run build
    staticPublishPath: ./app/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APP_NAME
        sync: false
      - key: VITE_APP_ENV
        value: production
